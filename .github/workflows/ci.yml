name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # mkvmerge and mkvextract: without them the integration test is skipped.
      - run: sudo apt-get update && sudo apt-get install -y mkvtoolnix
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
